
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porcentagem | Financeiro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-calculo">
    <main class="calculadora-card">
        <a class="voltar-painel" href="{{ url_for('painel') }}">← Voltar ao painel</a>
        <div class="cabecalho-calculo">
            <span class="icone-calculo">%</span>
            <p class="etiqueta-calculo">FERRAMENTA FINANCEIRA</p>
            <h1>Calculadora de porcentagem</h1>
            <p>Calcule porcentagens, descontos e acréscimos.</p>
        </div>

        <form method="POST" class="form-calculo">
            <label for="valor">Valor inicial (R$)</label>
            <input type="number" id="valor" name="valor" min="0" step="0.01" placeholder="Ex.: 500" required>

            <label for="taxa">Porcentagem (%)</label>
            <input type="number" id="taxa" name="taxa" min="0" step="0.01" placeholder="Ex.: 10" required>

            <label for="operacao">Operação</label>
            <select id="operacao" name="operacao">
                <option value="porcentagem">Calcular porcentagem</option>
                <option value="desconto">Aplicar desconto</option>
                <option value="acrescimo">Aplicar acréscimo</option>
            </select>

            <button type="submit">Calcular agora</button>
        </form>

        {% if resultado is not none %}
        <div class="resultado-calculo">
            <span>RESULTADO</span>
            <h2>R$ {{ "%.2f"|format(resultado) }}</h2>
        </div>
        {% endif %}

        {% if erro %}
        <p class="erro-calculo">{{ erro }}</p>
        {% endif %}
    </main>
</body>
</html>
